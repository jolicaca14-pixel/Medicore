version: '3.8'

services:
  postgres:
    image: postgres:14-alpine
    container_name: medicore-postgres
    environment:
      POSTGRES_USER: medicore
      POSTGRES_PASSWORD: medicore_dev_2024
      POSTGRES_DB: medicore_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/database/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medicore"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
